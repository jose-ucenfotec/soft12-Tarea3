<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maratón de series · Buscador</title>
    <!-- Bootstrap instalado con npm (no CDN) y luego los estilos propios -->
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-primary mb-4">
      <div class="container">
        <span class="navbar-brand fw-bold">🍿 Maratón de series</span>
        <span class="navbar-text">Buscador</span>
      </div>
    </nav>

    <main class="container pb-5">
      <!-- Búsqueda -->
      <section class="card shadow-sm mb-4">
        <div class="card-body">
          <h2 class="h5 card-title mb-3">Buscar series</h2>
          <form id="form-busqueda" class="d-flex gap-2 mb-3">
            <input id="texto-busqueda" class="form-control" placeholder="Ejemplo: dark, office, arcane" />
            <button type="submit" class="btn btn-primary">Buscar</button>
          </form>
          <!-- Aquí aparecen los mensajes: cargando, error o sin resultados -->
          <div id="estado"></div>
          <!-- Aquí aparecen las tarjetas de resultados -->
          <div id="resultados" class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-3"></div>
        </div>
      </section>

      <!-- Propuesta -->
      <section class="card shadow-sm">
        <div class="card-body">
          <h2 class="h5 card-title mb-3">Proponer una serie al club</h2>
          <form id="form-propuesta">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="titulo" class="form-label">Título</label>
                <input id="titulo" name="titulo" class="form-control" required minlength="2" />
              </div>
              <div class="col-md-6">
                <label for="correo" class="form-label">Correo de quien propone</label>
                <input id="correo" name="correo" type="email" class="form-control" required />
              </div>
              <div class="col-12">
                <label for="motivo" class="form-label">Motivo</label>
                <textarea id="motivo" name="motivo" class="form-control" rows="2" required></textarea>
              </div>
            </div>
            <button id="boton-propuesta" type="submit" class="btn btn-primary mt-3">Enviar propuesta</button>
          </form>
          <div id="alerta-propuesta" class="mt-3"></div>
        </div>
      </section>
    </main>

    <!-- type="module" permite usar import y export entre archivos -->
    <script type="module" src="js/main.js"></script>
  </body>
</html>
